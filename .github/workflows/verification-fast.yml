name: verification-fast

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run verificationFast
        run: ./gradlew verificationFast --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            build/reports/ili2grails-verification/
            build/reports/model-corpus/
          if-no-files-found: ignore
