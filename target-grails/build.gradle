plugins {
    id 'java-library'
}

dependencies {
    api project(':core')
    implementation project(':grails-runtime-api')

    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${rootProject.jacksonVersion}"

    testImplementation testFixtures(project(':core'))
    testImplementation "org.junit.jupiter:junit-jupiter:${rootProject.junitVersion}"
    testImplementation "org.assertj:assertj-core:${rootProject.assertjVersion}"
    testImplementation "org.apache.groovy:groovy:${rootProject.groovyVersion}"
    testImplementation "org.locationtech.jts:jts-core:${rootProject.jtsVersion}"
    testImplementation "com.microsoft.playwright:playwright:${rootProject.playwrightVersion}"
    testRuntimeOnly "com.h2database:h2:${rootProject.h2Version}"
}

sourceSets {
    grailsRuntimeSmokeTest {
        java.srcDir 'src/grailsRuntimeSmokeTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    realIli2dbSmokeTest {
        java.srcDir 'src/realIli2dbSmokeTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    browserE2eTest {
        java.srcDir 'src/browserE2eTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    grailsPostgresContractTest {
        java.srcDir 'src/grailsPostgresContractTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    grailsRuntimeSmokeTestImplementation.extendsFrom testImplementation
    grailsRuntimeSmokeTestRuntimeOnly.extendsFrom testRuntimeOnly
    realIli2dbSmokeTestImplementation.extendsFrom testImplementation
    realIli2dbSmokeTestRuntimeOnly.extendsFrom testRuntimeOnly
    browserE2eTestImplementation.extendsFrom testImplementation
    browserE2eTestRuntimeOnly.extendsFrom testRuntimeOnly
    grailsPostgresContractTestImplementation.extendsFrom testImplementation
    grailsPostgresContractTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// Externe Testumgebung (Spezifikation §10): ili2pg wird ausschliesslich über
// -Pili2pgHome oder ILI2PG_HOME bezogen. Es gibt keinen lokalen Default.
def resolveIli2pgHome() {
    def configured = project.findProperty('ili2pgHome')
    if (configured != null && !configured.toString().isBlank()) {
        return configured
    }
    def env = System.getenv('ILI2PG_HOME')
    if (env != null && !env.isBlank()) {
        return env
    }
    return null
}

def ili2pgHome = resolveIli2pgHome()

def requiredSystemProperty(name) {
    project.findProperty(name) ?: 'false'
}

tasks.register('verifyModelCorpusManifest', JavaExec) {
    description = 'Validiert den versionierten INTERLIS-Modellkorpus (verification/model-corpus.yaml).'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ch.interlis.generator.grails.verification.corpus.ModelCorpusManifestVerifier'
    systemProperty 'corpusFile', rootProject.file('verification/model-corpus.yaml').absolutePath
}

tasks.register('verifyFeatureMatrixUpToDate', JavaExec) {
    description = 'Regeneriert die Feature-Matrix und vergleicht sie mit der committeden Datei.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ch.interlis.generator.grails.verification.corpus.FeatureMatrixVerifier'
    systemProperty 'corpusFile', rootProject.file('verification/model-corpus.yaml').absolutePath
}

tasks.register('verifyGenerationOwnershipRules', JavaExec) {
    description = 'Validiert die Ownership-Regeln der Generator-Projektdateien.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ch.interlis.generator.grails.project.GenerationOwnershipRuleVerifier'
}

tasks.register('writeVerificationSummary', JavaExec) {
    description = 'Schreibt die gemeinsame Verification-Summary (JSON + Markdown).'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ch.interlis.generator.grails.verification.report.VerificationSummaryTask'
    systemProperty 'reportDir', rootProject.layout.buildDirectory.dir('reports/ili2grails-verification').get().asFile.absolutePath
}

tasks.register('grailsRuntimeSmokeTest', Test) {
    description = 'Runs opt-in Grails runtime smoke tests against a temporary Grails app.'
    group = 'verification'
    testClassesDirs = sourceSets.grailsRuntimeSmokeTest.output.classesDirs
    classpath = sourceSets.grailsRuntimeSmokeTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    dependsOn rootProject.tasks.named('prepareLocalRuntime')
    systemProperty 'grailsRuntimeSmokeRequired', requiredSystemProperty('grailsRuntimeSmokeRequired')
    outputs.upToDateWhen { false }
}

tasks.register('realIli2dbSmokeTest', Test) {
    description = 'Runs opt-in ili2pg/PostGIS smoke tests against the docker-compose edit-db.'
    group = 'verification'
    testClassesDirs = sourceSets.realIli2dbSmokeTest.output.classesDirs
    classpath = sourceSets.realIli2dbSmokeTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    systemProperty 'realIli2dbRequired', requiredSystemProperty('realIli2dbRequired')
    if (ili2pgHome != null) {
        systemProperty 'ili2pgHome', ili2pgHome
    }
    outputs.upToDateWhen { false }
}

tasks.register('browserE2eTest', Test) {
    description = 'Runs opt-in browser end-to-end tests against a generated Grails app.'
    group = 'verification'
    testClassesDirs = sourceSets.browserE2eTest.output.classesDirs
    classpath = sourceSets.browserE2eTest.runtimeClasspath
    shouldRunAfter tasks.named('realIli2dbSmokeTest')
    dependsOn rootProject.tasks.named('prepareLocalRuntime')
    systemProperty 'browserE2eRequired', requiredSystemProperty('browserE2eRequired')
    if (ili2pgHome != null) {
        systemProperty 'ili2pgHome', ili2pgHome
    }
    systemProperty 'browserE2eJdbcUrl', project.findProperty('browserE2eJdbcUrl') ?: 'jdbc:postgresql://localhost:54321/edit?user=postgres&password=secret&dbSchema=sa'
    if (project.findProperty('browserE2eAppUrl') != null) {
        systemProperty 'browserE2eAppUrl', project.findProperty('browserE2eAppUrl')
    }
    outputs.upToDateWhen { false }
}

tasks.register('grailsPostgresContractTest', Test) {
    description = 'Runs generated Grails/GORM contracts against a real ili2pg PostgreSQL schema.'
    group = 'verification'
    testClassesDirs = sourceSets.grailsPostgresContractTest.output.classesDirs
    classpath = sourceSets.grailsPostgresContractTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('grailsRuntimeSmokeTest')
    dependsOn rootProject.tasks.named('prepareLocalRuntime')
    systemProperty 'contractTestRequired', requiredSystemProperty('contractTestRequired')
    if (ili2pgHome != null) {
        systemProperty 'ili2pgHome', ili2pgHome
    }
    systemProperty 'contractJdbcUrl',
        project.findProperty('contractJdbcUrl') ?: 'jdbc:postgresql://localhost:54321/edit?user=postgres&password=secret'
    outputs.upToDateWhen { false }
}

tasks.named('writeVerificationSummary') {
    mustRunAfter(
        tasks.named('grailsRuntimeSmokeTest'),
        tasks.named('realIli2dbSmokeTest'),
        tasks.named('grailsPostgresContractTest'),
        tasks.named('browserE2eTest')
    )
}
